name: vintage-shield

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BOT_API_KEY: ${BOT_API_KEY}
      ADMIN_GUILD_ID: ${ADMIN_GUILD_ID}
      DEMO_MODE: "false"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
    expose:
      - "3000"
    networks:
      internal:
      proxy:
        aliases:
          - vintage-shield-web

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      BOT_API_KEY: ${BOT_API_KEY}
      ADMIN_GUILD_ID: ${ADMIN_GUILD_ID}
      SHIELD_API_URL: http://web:3000
      WEBSITE_URL: https://${DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
  proxy:
    external: true
    name: web-proxy

volumes:
  postgres_data:
    name: vintage-shield-postgres-data
